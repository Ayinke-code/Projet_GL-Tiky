spring.application.name=${APP_NAME:backend-api}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mydb}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Error Handling
server.error.include-message=${ERROR_INCLUDE_MESSAGE:always}

# JWT Configuration
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# User informations
app.default-password=${DEFAULT_PASSWORD:password}

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=false

# CORS Configuration
cors.allowed-origins=http://localhost,http://172.24.1.16,http://172.24.1.32,https://172.24.1.16,https://172.24.1.32,http://localhost:*,http://172.24.1.16:*,http://172.24.1.32:*,https://172.24.1.16:*,https://172.24.1.32:*