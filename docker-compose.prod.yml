services:
  nginx:
      image: nginx:alpine
      container_name: nginx
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
        - ./ssl:/etc/nginx/ssl:ro
      depends_on:
        - front
        - back
      restart: unless-stopped
      networks:
        - app-network

  back:
    build: ./back
    container_name: back
    expose:
          - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SERVER_PORT=8080
      - SERVER_CONTEXT_PATH=/api
      - JPA_SHOW_SQL=false
      - JPA_DDL_AUTO=update
      - ERROR_INCLUDE_MESSAGE=always
      - APP_NAME=backend-api
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=3600000
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app-network

  front:
    build: ./front
    container_name: front
    expose:
      - "3000"
    environment:
      - NUXT_PUBLIC_API_BASE=https://172.24.1.16/api
    depends_on:
      - back
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mariadb:10.11
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge