# Redirection HTTP → HTTPS
<VirtualHost *:80>
    ServerName 172.24.1.32
    
    # Rediriger tout le trafic HTTP vers HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# Configuration HTTPS
<VirtualHost *:443>
    ServerName 172.24.1.32
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Activation SSL
    SSLEngine on
    SSLCertificateFile /home/etudiant/app/ssl/server.crt
    SSLCertificateKeyFile /home/etudiant/app/ssl/server.key

    # Protocoles SSL modernes
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    # Logs
    ErrorLog /home/etudiant/app/logs/apache-error.log
    CustomLog /home/etudiant/app/logs/apache-access.log combined

    # Text compression (RGESN 6.3) - only text formats are listed: images, fonts
    # (woff2) and archives are already compressed, re-compressing them wastes CPU.
    # Declared at vhost level so it also covers the JSON returned by the /api proxy.
    # Brotli is preferred (better ratio); GZIP is the fallback for clients without "br".
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml
        # 5 = good ratio/CPU trade-off for on-the-fly compression (11 is too slow per request)
        BrotliCompressionQuality 5
        # Debian's stock mods-enabled/deflate.conf registers DEFLATE before this vhost, so
        # GZIP would run first and win. "no-gzip" turns mod_deflate off for clients that
        # accept Brotli; kept inside this IfModule so GZIP stays on when mod_brotli is absent.
        SetEnvIfNoCase Accept-Encoding "\bbr\b" no-gzip
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml
        DeflateCompressionLevel 6
    </IfModule>

    # Frontend statique (fichiers Nuxt)
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # SPA routing - toutes les routes → index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Reverse proxy vers le backend Spring Boot (port 8081)
    ProxyPreserveHost On
    ProxyRequests Off

    # Configuration CORS et proxy pour l'API
    <Location /api>
        # Activer le proxy
        ProxyPass http://localhost:8081/api
        ProxyPassReverse http://localhost:8081/api
        
        # Headers CORS
        Header always set Access-Control-Allow-Origin "%{HTTP:Origin}"
        Header always set Access-Control-Allow-Credentials "true"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With"
        
        # Répondre aux requêtes OPTIONS (preflight CORS)
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ $1 [R=204,L]
    </Location>
</VirtualHost>