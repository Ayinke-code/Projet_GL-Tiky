services:
  back:
    build: ./back
    container_name: back
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - db

  front:
    build: ./front
    container_name: front
    ports:
      - "3000:3000"
    depends_on:
      - back

  db:
    image: mariadb:10.11
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mydb
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: