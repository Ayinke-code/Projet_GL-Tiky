image: srv-proxy.openstack.etudis.eseo.fr:1973/projetgl-cicd:latest

variables:
  # Maven configuration
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dhttp.proxyHost=192.168.4.8 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=192.168.4.8 -Dhttps.proxyPort=3128"
  MAVEN_CLI_OPTS: "-s $CI_PROJECT_DIR/.m2/settings.xml --batch-mode"
  
  # SonarQube configuration
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  
  # Proxy exceptions
  no_proxy: "gitlab-etu.openstack.etudis.eseo.fr,localhost,127.0.0.1,172.24.1.1"

cache:
  policy: pull-push
  key: "maven-sonar-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository
    - .sonar/cache
    - back/target/

stages:
  - build
  - test
  - deploy
  - selenium
  - sonar

before_script:
  # Install OpenSSL and add SonarQube SSL certificate to Java truststore
  - apt-get update && apt-get install -y openssl
  - echo -n | openssl s_client -connect 172.24.1.1:443 -showcerts | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > /tmp/sonar.crt
  - keytool -import -v -trustcacerts -alias sonar -file /tmp/sonar.crt -keystore $JAVA_HOME/lib/security/cacerts -storepass changeit -noprompt
  
  # Clean ChromeDriver if needed
  - rm -f /usr/bin/chromedriver || true
  
  # Set proxy environment variables
  - export http_proxy=http://192.168.4.8:3128
  - export https_proxy=http://192.168.4.8:3128
  
  # Create Maven proxy configuration
  - mkdir -p .m2
  - |
    cat > .m2/settings.xml <<EOF
    <settings>
      <proxies>
        <proxy>
          <id>proxy</id>
          <active>true</active>
          <protocol>http</protocol>
          <host>192.168.4.8</host>
          <port>3128</port>
        </proxy>
        <proxy>
          <id>https-proxy</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>192.168.4.8</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>
    EOF

# Stage 1: Build
build:
  stage: build
  script:
    - cd back
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - back/target/
    expire_in: 1 hour
  rules:
    # - if: $CI_COMMIT_BRANCH   # toutes les branches
    - when: never # Pipeline dev

# Stage 2: Unit Tests
unit-test:
  stage: test
  script:
    - cd back
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - back/target/surefire-reports/TEST-*.xml
    paths:
      - back/target/surefire-reports/
    expire_in: 1 day
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH   # toutes les branches
    # - when: never # Pipeline dev

# Stage 3: Deploy sur serveur de dev
deploy:
  stage: deploy
  before_script:
    # Installation des outils SSH
    - apt-get update && apt-get install -y openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 $SSH_PRIVATE_KEY
    - ssh-add $SSH_PRIVATE_KEY
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    
    # Ajouter le serveur aux known_hosts
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts
    
  script:
    # Vérifier la connexion SSH
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "echo 'Connexion SSH réussie'"
    
    # Créer le dossier de déploiement
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p $DEPLOY_PATH"
    
    # Transfert des fichiers (back, front, docker-compose.prod.yml)
    - |
      rsync -avz --delete \
        --exclude 'node_modules' \
        --exclude '.git' \
        --exclude 'target' \
        --exclude '.m2' \
        --exclude '.sonar' \
        --exclude '.nuxt' \
        --exclude '.output' \
        --exclude 'dist' \
        back/ \
        $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/back/
    
    - |
      rsync -avz --delete \
        --exclude 'node_modules' \
        --exclude '.git' \
        --exclude '.nuxt' \
        --exclude '.output' \
        --exclude 'dist' \
        front/ \
        $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/front/
    
    - scp docker-compose.prod.yml $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/docker-compose.yml
    
    # Déploiement Docker sur le serveur
    - |
      ssh $DEPLOY_USER@$DEPLOY_SERVER << 'ENDSSH'
        cd $DEPLOY_PATH
        
        echo "📦 Arrêt des anciens conteneurs..."
        docker-compose down || true
        
        echo "🔨 Build et démarrage des conteneurs..."
        docker-compose up -d --build
        
        echo "⏳ Attente du démarrage (30 secondes)..."
        sleep 30
        
        echo "✅ État des conteneurs :"
        docker-compose ps
        
        echo "📋 Logs des conteneurs :"
        docker-compose logs --tail=50
        
        echo "🔍 Test de santé du backend..."
        curl -f http://localhost:8080/api/health || echo "⚠️ Health check échoué (normal si pas de endpoint /health)"
        
        echo "✅ Déploiement terminé !"
      ENDSSH
    
  environment:
    name: dev
    url: http://172.24.1.16:8080
    
  dependencies:
    - build
  
  rules:
    # - dev  # Pipeline dev
    # - main
    - when: never

# Stage 4: Selenium Tests
selenium-test:
  stage: selenium
  script:
    - cd back
    # Lancer les tests Selenium
    - mvn $MAVEN_CLI_OPTS verify -Pselenium
  artifacts:
    when: always
    paths:
      - back/target/selenium-reports/
    expire_in: 1 day
  # dependencies:  # Pipeline dev
  #   - deploy
  # allow_failure: true
  rules:
    # - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # - if: $CI_COMMIT_BRANCH == "main"
    # - if: $CI_COMMIT_BRANCH == "dev"
    # - if: $CI_COMMIT_BRANCH
    - when: never # Pipeline dev

# Stage 5: SonarQube Analysis
sonar:
  stage: sonar
  script:
    - cd back
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar -Dsonar.token=$SONAR_TOKEN
  dependencies:
    - unit-test
  # allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
    - if: $CI_COMMIT_BRANCH # Pipeline dev
