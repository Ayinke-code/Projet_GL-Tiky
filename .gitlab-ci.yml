image: srv-proxy.openstack.etudis.eseo.fr:1973/projetgl-cicd:latest

variables:
  # Maven configuration
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dhttp.proxyHost=192.168.4.8 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=192.168.4.8 -Dhttps.proxyPort=3128"
  MAVEN_CLI_OPTS: "-s $CI_PROJECT_DIR/.m2/settings.xml --batch-mode"
  
  # SonarQube configuration
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  
  # Proxy exceptions
  no_proxy: "gitlab-etu.openstack.etudis.eseo.fr,localhost,127.0.0.1,172.24.1.1"

cache:
  policy: pull-push
  key: "maven-sonar-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository
    - .sonar/cache
    - back/target/
    - front/node_modules/
    - front/.nuxt/

stages:
  - build
  - test
  - deploy
  - selenium
  - sonar

before_script:
  # Install OpenSSL and add SonarQube SSL certificate to Java truststore
  - apt-get update && apt-get install -y openssl curl
  - echo -n | openssl s_client -connect 172.24.1.1:443 -showcerts | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > /tmp/sonar.crt
  - keytool -import -v -trustcacerts -alias sonar -file /tmp/sonar.crt -keystore $JAVA_HOME/lib/security/cacerts -storepass changeit -noprompt
  
  # Clean ChromeDriver if needed
  - rm -f /usr/bin/chromedriver || true
  
  # Set proxy environment variables
  - export http_proxy=http://192.168.4.8:3128
  - export https_proxy=http://192.168.4.8:3128
  
  # Create Maven proxy configuration
  - mkdir -p .m2
  - |
    cat > .m2/settings.xml <<EOF
    <settings>
      <proxies>
        <proxy>
          <id>proxy</id>
          <active>true</active>
          <protocol>http</protocol>
          <host>192.168.4.8</host>
          <port>3128</port>
        </proxy>
        <proxy>
          <id>https-proxy</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>192.168.4.8</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>
    EOF

# Stage 1: Build Backend (JAR)
build-backend:
  stage: build
  script:
    - cd back
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
    - ls -lh target/*.jar
  artifacts:
    paths:
      - back/target/*.jar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH

# Stage 2: Build Frontend (fichiers statiques)
build-frontend:
  stage: build

  script:
    - export http_proxy=http://192.168.4.8:3128
    - export https_proxy=http://192.168.4.8:3128

    - npm config set proxy http://192.168.4.8:3128
    - npm config set https-proxy http://192.168.4.8:3128
    - cd front
    - npm ci
  script:
    # Build Nuxt en mode production (génère .output/public)
    - npm run generate
    - ls -lah .output/public
  artifacts:
    paths:
      - front/.output/public/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH

# Stage 2: Unit Tests
unit-test:
  stage: test
  script:
    - cd back
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - back/target/surefire-reports/TEST-*.xml
    paths:
      - back/target/surefire-reports/
    expire_in: 1 day
  dependencies:
    - build-frontend
    - build-backend
  rules:
    # - if: $CI_COMMIT_BRANCH   # toutes les branches
    - when: never # Pipeline dev

# Stage 3: Deploy sur serveur de dev
deploy:
  stage: deploy
  before_script:
    # Installation des outils SSH
    - apt-get update && apt-get install -y openssh-client rsync
    - eval $(ssh-agent -s)
    
    # Créer le dossier SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    
    # Créer le fichier de clé avec la variable
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    
    # Ajouter la clé à l'agent
    - ssh-add ~/.ssh/id_rsa
    
    # Ajouter le serveur aux known_hosts
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts
    
  script:
    # Vérifier la connexion SSH
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "echo 'Connexion SSH réussie'"
    
    # Créer l'arborescence sur le serveur
    - |
      ssh $DEPLOY_USER@$DEPLOY_SERVER << 'ENDSSH'
        mkdir -p ~/app/backend
        mkdir -p ~/app/frontend
        mkdir -p ~/app/ssl
        mkdir -p ~/app/logs
      ENDSSH
    
    # Transférer les certificats SSL
    - echo "$SSL_CERT_DEV" | ssh $DEPLOY_USER@$DEPLOY_SERVER "cat > ~/app/ssl/server.crt"
    - echo "$SSL_KEY_DEV" | ssh $DEPLOY_USER@$DEPLOY_SERVER "cat > ~/app/ssl/server.key"
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "chmod 644 ~/app/ssl/server.crt && chmod 600 ~/app/ssl/server.key"
    
    # Transférer le JAR backend
    - scp back/target/*.jar $DEPLOY_USER@$DEPLOY_SERVER:~/app/backend/app.jar
    
    # Transférer les fichiers statiques frontend
    - rsync -avz --delete front/.output/public/ $DEPLOY_USER@$DEPLOY_SERVER:~/app/frontend/
    
    # Transférer le fichier .env
    - echo "$DEPLOY_ENV_FILE" | ssh $DEPLOY_USER@$DEPLOY_SERVER "cat > ~/app/.env"
    
    # Redémarrer les services sur le serveur
    - |
      ssh $DEPLOY_USER@$DEPLOY_SERVER << 'ENDSSH'
        cd ~/app
        
        echo "🛑 Arrêt de l'ancienne application backend..."
        pkill -f 'java -jar.*app.jar' || echo "Aucun processus Java à arrêter"
        
        echo "🚀 Démarrage du backend..."
        nohup java -jar ~/app/backend/app.jar \
          --spring.config.additional-location=file:~/app/.env \
          > ~/app/logs/backend.log 2>&1 &
        
        echo "⏳ Attente du démarrage (15 secondes)..."
        sleep 15
        
        echo "✅ Vérification des processus..."
        ps aux | grep java | grep -v grep || echo "⚠️ Backend non démarré"
        
        echo "🔍 Test de santé..."
        curl -f http://localhost:8081/api/user || echo "⚠️ Health check échoué"
        
        echo "📋 Dernières lignes des logs backend:"
        tail -20 ~/app/logs/backend.log
        
        echo "✅ Déploiement terminé !"
      ENDSSH
    
  environment:
    name: dev
    url: https://172.24.1.16
    
  dependencies:
    - build-backend
    - build-frontend
  
  rules:
    # - dev  # Pipeline dev
    # - main
    # - when: never
    - if: $CI_COMMIT_BRANCH   # toutes les branches

# Stage 4: Selenium Tests
selenium-test:
  stage: selenium
  script:
    - cd back
    # Lancer les tests Selenium
    - mvn $MAVEN_CLI_OPTS verify -Pselenium
  artifacts:
    when: always
    paths:
      - back/target/selenium-reports/
    expire_in: 1 day
  # dependencies:  # Pipeline dev
  #   - deploy
  # allow_failure: true
  rules:
    # - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # - if: $CI_COMMIT_BRANCH == "main"
    # - if: $CI_COMMIT_BRANCH == "dev"
    # - if: $CI_COMMIT_BRANCH
    - when: never # Pipeline dev

# Stage 5: SonarQube Analysis
sonar:
  stage: sonar
  script:
    - cd back
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar -Dsonar.token=$SONAR_TOKEN
  dependencies:
    - unit-test
  rules:
    # - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # - if: $CI_COMMIT_BRANCH == 'main'
    # - if: $CI_COMMIT_BRANCH == 'dev'
    # - if: $CI_COMMIT_BRANCH # Pipeline dev
    - when: never # Pipeline dev
